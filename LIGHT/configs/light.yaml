_BASE_: "./base.yaml"

# base settings
output_dir: './_runs/'
base_model: "light"
exp_name: 'test'
embedding_components: ["token", "poly"]
aux_losses: ["bidirection", "focal", "style_contrastive"]

# Word-aligned visual/style branch. Crops come from the original-resolution map.
use_word_style: True
word_crop_height: 32
word_crop_width: 128
word_crop_context: 0.25
word_crop_save_dir: "./word_crops"
max_style_words: 256
style_embedding_dim: 256
# LayerNorm(text/style) -> concatenate -> MLP -> learned gated residual.
style_fusion_hidden_dim: 768
style_contrastive_weight: 0.1
style_temperature: 0.1

# Adds a learned directional geometry/style bias to the original dot-product score.
use_pairwise_relations: True

token_padding_max_length: 1000
padding_token_id: -100
mask_token_id: -1
max_len: 32

poly_only: False
text_only: False

light_pretrained_weights: "/workspace/weights/pretrain_light/model_epoch_3500.pth"
# light_pretrained_weights: "_runs/test__v3/models/model_epoch_1.pth"

batch_size: 2
train_datasets: ["MapText_train"]
train_data_probabilities: [1]
val_dataset: "MapText_val"
val_data_shuffle: False

save_every_epoch: 100
eval_every_epoch: 1
num_epochs: 100
# Task heads, word-style encoder, and gated fusion learning rate.
lr: 0.00005
# Lower learning rate for the pretrained LIGHT backbone.
backbone_lr: 0.000005
weight_decay: 0.0
scheduler_patience: 5
patience: 9

version: 4
