_BASE_: "./base.yaml"

# base settings
output_dir: './_runs/'
base_model: "light"
exp_name: 'visual_edge_residual_baseline_init'
embedding_components: ["token", "poly"]
aux_losses: ["bidirection", "focal"]

# Word-aligned visual/style branch. Crops come from the original-resolution map.
use_word_style: True
word_crop_height: 32
word_crop_width: 128
word_crop_context: 0.25
word_crop_save_dir: "./word_crops"
max_style_words: 256
style_embedding_dim: 256
# Preserve the original joint successor model and add a conservative learned
# visual/geometry residual directly to candidate-edge scores.
use_factorized_linking: False
use_visual_edge_residual: True
use_token_style_fusion: False
visual_pair_dim: 32
visual_edge_initial_scale: 0.05
visual_edge_max_scale: 1.0

# The clean text-only checkpoint has no relation MLP. Geometry is already part
# of the new visual edge scorer, so avoid introducing another random branch.
use_pairwise_relations: False
preserve_text_stop_scores: False
style_contrastive_weight: 0.0

token_padding_max_length: 1000
padding_token_id: -100
mask_token_id: -1
max_len: 32

poly_only: False
text_only: False

light_pretrained_weights: "/workspace/weights/pretrain_light/model_epoch_3500.pth"
# Initialize the complete text/layout linking model; only the new visual
# residual parameters should be missing when this checkpoint is loaded.
full_pretrained_weights: "/workspace/weights/finetune_light/best_model.pth"
freeze_base_epochs: 3
# light_pretrained_weights: "_runs/test__v3/models/model_epoch_1.pth"

batch_size: 2
train_datasets: ["MapText_train"]
train_data_probabilities: [1]
val_dataset: "MapText_val"
val_data_shuffle: False

save_every_epoch: 10
eval_every_epoch: 1
num_epochs: 100
# Task heads, word-style encoder, and edge scorer learning rate.
lr: 0.00005
# Lower learning rate for the pretrained LIGHT backbone.
backbone_lr: 0.000005
# Existing token/linking/relation heads loaded from the text-only baseline.
base_task_lr: 0.000005
weight_decay: 0.0
# Give the scratch visual residual enough time to learn before validation-loss
# early stopping is allowed. After epoch 30, tolerate 20 consecutive validation
# checks without a new best checkpoint.
min_epochs_before_early_stop: 30
scheduler_patience: 10
patience: 20

# Keep the completed v7 run intact; this is its longer-training successor.
version: 8
